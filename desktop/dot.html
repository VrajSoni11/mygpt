<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #wrap { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
  #dot {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #6ee7ff, #7c5cff);
    box-shadow: 0 0 14px rgba(124, 92, 255, 0.65);
    cursor: pointer;
    animation: breathe 3.5s ease-in-out infinite;
  }
  #dot:hover { filter: brightness(1.18); }
  #dot.alert {
    background: linear-gradient(135deg, #ffd166, #ff8a4c);
    box-shadow: 0 0 16px rgba(255, 150, 70, 0.85);
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
</style>
</head>
<body>
  <div id="wrap"><div id="dot"></div></div>
<script>
  const dot = document.getElementById('dot');
  let down = false, moved = false, sx = 0, sy = 0;

  dot.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    down = true; moved = false; sx = e.screenX; sy = e.screenY;
    dot.setPointerCapture(e.pointerId);
    window.jarvis.dragStart();
  });
  dot.addEventListener('pointermove', (e) => {
    if (!down) return;
    if (!moved && Math.hypot(e.screenX - sx, e.screenY - sy) > 4) moved = true;
    if (moved) window.jarvis.dragMove();
  });
  dot.addEventListener('pointerup', (e) => {
    if (!down) return;
    down = false;
    dot.releasePointerCapture(e.pointerId);
    if (!moved) {
      dot.classList.remove('alert');
      window.jarvis.dotClick();
    }
  });
  dot.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.jarvis.dotMenu();
  });
  window.jarvis.onAlert(() => dot.classList.add('alert'));
</script>
</body>
</html>
