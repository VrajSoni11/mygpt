<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* The canvas is always 104px and centred; the window around it grows and shrinks. */
  canvas { position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<script>
  const S = 104, C = S / 2, R = 25;               // canvas size, centre, sphere radius
  const TAU = Math.PI * 2;
  const cv = document.getElementById('orb');
  const dpr = window.devicePixelRatio || 1;
  cv.width = S * dpr; cv.height = S * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineJoin = 'round';

  let alertOn = false, hover = false, last = 0, t = 0;
  let target = 0;          // 0 = tiny dot, 1 = full sphere
  let grow = 0;            // current blend between the two (animated)
  let expanded = false;    // is the window currently the big size?
  let collapseTimer = null;
  let down = false, moved = false, sx = 0, sy = 0;

  // stable pseudo-random numbers so the pattern is the same on every launch
  const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // ---- golden filaments from the core, reaching all the way to the rim ----
  const gold = [];
  for (let i = 0; i < 46; i++) {
    gold.push({
      a: (i / 46) * TAU + rnd(i) * 0.2,
      curl: (rnd(i + 20) - 0.4) * 3.4,
      len: 0.62 + rnd(i + 40) * 0.5,
      start: rnd(i + 55) < 0.35 ? rnd(i + 56) * 0.28 : 0,
      w: 0.5 + rnd(i + 60) * 0.6,
      sp: 0.3 + rnd(i + 80) * 0.6,
      ph: rnd(i + 100) * TAU,
      br: (rnd(i + 120) - 0.5) * 1.6,
      hasBranch: rnd(i + 130) < 0.6,
    });
  }
  // ---- green ribbons: mostly through the outer part of the sphere ----
  const ribbons = [];
  for (let i = 0; i < 9; i++) {
    ribbons.push({
      a: (i / 9) * TAU + rnd(i + 400) * 0.6,
      curl: (rnd(i + 420) - 0.2) * 3.0,
      len: 0.85 + rnd(i + 440) * 0.2,
      start: 0.3 + rnd(i + 450) * 0.25,
      w: 1.2 + rnd(i + 460) * 0.9,
      sp: 0.25 + rnd(i + 480) * 0.4,
      ph: rnd(i + 500) * TAU,
    });
  }
  // ---- long flowing streams leaving the sphere ----
  const streams = [];
  for (let j = 0; j < 10; j++) {
    streams.push({
      a: (j / 10) * TAU + rnd(j + 200) * 0.5,
      curl: (rnd(j + 220) - 0.5) * 2.6,
      len: 17 + rnd(j + 240) * 9,
      sp: 0.35 + rnd(j + 260) * 0.5,
      ph: rnd(j + 280) * TAU,
      green: j % 3 === 1,
      w: 0.65 + rnd(j + 300) * 0.8,
    });
  }
  const sparks = [];

  function pt(f, u, extra) {
    const span = f.start || 0;
    const r = (span + u * (f.len - span)) * R;
    const ang = f.a + t * 0.12 + f.curl * (span + u * (f.len - span)) + Math.sin(t * f.sp + f.ph + u * 4) * 0.38 * u + (extra || 0);
    return [C + Math.cos(ang) * r, C + Math.sin(ang) * r];
  }

  function trace(f, lw) {
    ctx.beginPath();
    const steps = 16;
    for (let k = 0; k <= steps; k++) {
      const [x, y] = pt(f, k / steps);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = lw;
    ctx.stroke();
    if (f.hasBranch) {
      ctx.beginPath();
      for (let k = 8; k <= steps; k++) {
        const u = k / steps;
        const [x, y] = pt(f, u, (u - 0.5) * f.br * 2.2);
        if (k === 8) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = lw * 0.6;
      ctx.stroke();
    }
  }

  function drawStream(s, reach) {
    const steps = 14;
    const pts = [];
    for (let k = 0; k <= steps; k++) {
      const u = k / steps;
      const r = R - 1 + u * s.len * reach;
      const ang = s.a + t * 0.05 + s.curl * u + Math.sin(t * s.sp + s.ph + u * 3.2) * 0.32 * u;
      pts.push([C + Math.cos(ang) * r, C + Math.sin(ang) * r]);
    }
    const col = s.green && !alertOn ? '90, 255, 120' : '255, 205, 80';
    const a = pts[0], b = pts[steps];
    const g = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
    g.addColorStop(0, 'rgba(' + col + ',0.75)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < steps; k++) {
      const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
    }
    ctx.strokeStyle = g;
    ctx.lineCap = 'butt';
    ctx.lineWidth = s.w;
    ctx.stroke();
  }

  // ---------- the full sphere (shown on hover) ----------
  function drawSphere() {
    const pulse = 0.5 + 0.5 * Math.sin(t * (alertOn ? 5 : 1.8));
    const reach = alertOn ? 1.2 : hover ? 1.1 : 1;

    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(C, C, R * 0.8, C, C, R + 18);
    aura.addColorStop(0, 'rgba(255, 190, 50,' + ((alertOn ? 0.55 : 0.26) + 0.1 * pulse) + ')');
    aura.addColorStop(0.6, 'rgba(70, 200, 90,' + (alertOn ? 0.12 : 0.07) + ')');
    aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(C, C, R + 18, 0, TAU); ctx.fill();

    for (const s of streams) drawStream(s, reach);

    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.beginPath(); ctx.arc(C, C, R, 0, TAU); ctx.clip();
    const body = ctx.createRadialGradient(C, C, 2, C, C, R);
    body.addColorStop(0, '#2a1d02'); body.addColorStop(0.5, '#0b1104'); body.addColorStop(1, '#040803');
    ctx.fillStyle = body; ctx.fillRect(0, 0, S, S);

    ctx.globalCompositeOperation = 'lighter';
    const goldG = ctx.createRadialGradient(C, C, 0, C, C, R);
    goldG.addColorStop(0, 'rgba(255, 238, 160, 1)');
    goldG.addColorStop(0.45, 'rgba(255, 196, 64, 0.8)');
    goldG.addColorStop(1, 'rgba(222, 160, 34, 0.6)');
    const greenG = ctx.createRadialGradient(C, C, 0, C, C, R);
    greenG.addColorStop(0, 'rgba(170, 255, 150, 0.7)');
    greenG.addColorStop(1, 'rgba(50, 215, 85, 0.65)');

    for (const f of ribbons) {
      ctx.strokeStyle = alertOn ? goldG : greenG;
      ctx.globalAlpha = 0.22; trace(f, f.w * 4.4);
      ctx.globalAlpha = 0.9;  trace(f, f.w * 1.0);
    }
    ctx.strokeStyle = goldG;
    for (const f of gold) {
      ctx.globalAlpha = 0.07; trace(f, f.w * 3.2);
      ctx.globalAlpha = 0.9;  trace(f, f.w * 0.85);
    }
    ctx.globalAlpha = 1;

    const cr = (alertOn ? 13 : 9) + 2 * pulse;
    const core = ctx.createRadialGradient(C, C, 0, C, C, cr);
    core.addColorStop(0, 'rgba(255, 252, 225, 1)');
    core.addColorStop(0.15, 'rgba(255, 224, 110, 0.95)');
    core.addColorStop(0.5, 'rgba(255, 165, 35, 0.35)');
    core.addColorStop(1, 'rgba(255, 150, 20, 0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(C, C, cr, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 240, 190, 0.5)'; ctx.lineWidth = 0.6;
    const ray = 6 + 3 * pulse;
    ctx.beginPath();
    ctx.moveTo(C - ray, C); ctx.lineTo(C + ray, C);
    ctx.moveTo(C, C - ray); ctx.lineTo(C, C + ray);
    ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
    const rimGlow = ctx.createRadialGradient(C, C, R * 0.8, C, C, R);
    rimGlow.addColorStop(0, 'rgba(255, 200, 80, 0)');
    rimGlow.addColorStop(1, 'rgba(255, 205, 90, 0.4)');
    ctx.fillStyle = rimGlow; ctx.fillRect(0, 0, S, S);
    ctx.restore();

    const edge = ctx.createLinearGradient(C - R, C - R, C + R, C + R);
    edge.addColorStop(0, 'rgba(255, 242, 175, 0.95)');
    edge.addColorStop(0.5, 'rgba(205, 155, 45, 0.5)');
    edge.addColorStop(1, 'rgba(255, 200, 80, 0.8)');
    ctx.lineWidth = 1.1; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.arc(C, C, R - 0.3, 0, TAU); ctx.stroke();

    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.018;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = (p.green ? 'rgba(130, 255, 150,' : 'rgba(255, 215, 110,') + (0.9 * p.life) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- the tiny dot (shown at rest) ----------
  function drawTiny(alpha) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.6);
    const r = alertOn ? 4.4 + 1.8 * pulse : 4.2;
    ctx.globalAlpha = alpha;
    const glow = ctx.createRadialGradient(C, C, 0, C, C, 12);
    if (alertOn) {
      glow.addColorStop(0, 'rgba(255, 200, 70,' + (0.6 + 0.25 * pulse) + ')');
      glow.addColorStop(1, 'rgba(255, 170, 40, 0)');
    } else {
      glow.addColorStop(0, 'rgba(46, 229, 154,' + (0.34 + 0.14 * pulse) + ')');
      glow.addColorStop(1, 'rgba(31, 169, 104, 0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(C, C, 12, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(C - 1.2, C - 1.4, 0.4, C, C, r);
    if (alertOn) {
      body.addColorStop(0, '#fff2b8'); body.addColorStop(0.5, '#f0b93a'); body.addColorStop(1, '#a8740e');
    } else {
      body.addColorStop(0, '#9dffd6'); body.addColorStop(0.5, '#25cc80'); body.addColorStop(1, '#12804c');
    }
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(C, C, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, S, S);
    if (grow > 0.02) {
      const sc = 0.15 + 0.85 * grow;             // the sphere blooms out of the dot
      ctx.save();
      ctx.translate(C, C); ctx.scale(sc, sc); ctx.translate(-C, -C);
      drawSphere();
      ctx.restore();
    }
    if (grow < 0.98) drawTiny(1 - grow);
  }

  function spawnSpark() {
    const a = Math.random() * TAU, r = R + 2 + Math.random() * 12;
    sparks.push({
      x: C + Math.cos(a) * r, y: C + Math.sin(a) * r,
      vx: Math.cos(a) * 0.18 + (Math.random() - 0.5) * 0.16,
      vy: Math.sin(a) * 0.18 + (Math.random() - 0.5) * 0.16,
      life: 1, s: 0.35 + Math.random() * 0.55, green: Math.random() < 0.25,
    });
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const busy = grow > 0.005 || target > 0;
    if (now - last < (busy ? 33 : 80)) return;      // sphere ~30 fps, tiny dot ~12 fps (almost no CPU)
    last = now;
    t += 0.033 * (alertOn ? 2.4 : hover ? 1.5 : 1);
    grow += (target - grow) * 0.24;
    if (Math.abs(target - grow) < 0.01) grow = target;
    if (expanded && target === 0 && grow === 0 && !down) {
      expanded = false;
      sparks.length = 0;
      window.jarvis.dotSize('small');                // shrink the window so it never blocks your clicks
    }
    if (grow > 0.5 && Math.random() < (alertOn ? 0.55 : 0.16) && sparks.length < 18) spawnSpark();
    draw();
  }
  requestAnimationFrame(frame);

  // ---------- hover, click, drag, right-click ----------
  const dist = (e) => Math.hypot(e.offsetX - C, e.offsetY - C);

  function expand() {
    clearTimeout(collapseTimer);
    target = 1;
    if (!expanded) { expanded = true; window.jarvis.dotSize('big'); }
  }
  function scheduleCollapse() {
    clearTimeout(collapseTimer);
    collapseTimer = setTimeout(() => { if (!down) { target = 0; hover = false; } }, 350);
  }

  cv.addEventListener('pointerenter', (e) => { if (dist(e) <= 18) expand(); });
  cv.addEventListener('pointermove', (e) => {
    if (down) {
      if (!moved && Math.hypot(e.screenX - sx, e.screenY - sy) > 4) moved = true;
      if (moved) window.jarvis.dragMove();
      return;
    }
    const d = dist(e);
    if (d <= (expanded ? R + 12 : 18)) { hover = d <= R + 6; expand(); }
    else scheduleCollapse();
  });
  cv.addEventListener('pointerleave', () => { if (!down) scheduleCollapse(); });

  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || dist(e) > (expanded ? R + 6 : 18)) return;
    down = true; moved = false; sx = e.screenX; sy = e.screenY;
    cv.setPointerCapture(e.pointerId);
    expand();
    window.jarvis.dragStart();
  });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return;
    down = false;
    cv.releasePointerCapture(e.pointerId);
    if (moved) {
      window.jarvis.dragEnd();                       // remembers where you left the dot
      if (dist(e) > R + 12) scheduleCollapse();
    } else {
      alertOn = false; target = 0; grow = 0; expanded = false; hover = false;
      window.jarvis.dotClick();                      // opens the panel, same as before
    }
  });
  cv.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.jarvis.dotMenu();
  });

  window.jarvis.onAlert(() => { alertOn = true; });
  window.jarvis.onDotReset(() => {                   // the panel opened: go back to the tiny dot
    alertOn = false; target = 0; grow = 0; expanded = false; hover = false; down = false;
    sparks.length = 0;
  });
</script>
</body>
</html>
