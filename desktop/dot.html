<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 76px; height: 76px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<script>
  const S = 76, C = S / 2, R = 24;          // window size, centre, orb radius
  const cv = document.getElementById('orb');
  const dpr = window.devicePixelRatio || 1;
  cv.width = S * dpr; cv.height = S * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  let alertOn = false, hover = false, last = 0, t = 0;
  const bubbles = [], sparks = [];

  function spawnBubble() {
    bubbles.push({
      x: C + (Math.random() * 2 - 1) * R * 0.62,
      y: C + R * 0.85,
      r: 1.4 + Math.random() * 3.4,
      vy: 0.22 + Math.random() * 0.5,
      ph: Math.random() * 6.28,
      gold: Math.random() < 0.45,
      age: 0,
    });
  }
  function spawnSpark() {
    const a = Math.random() * 6.283;
    sparks.push({
      x: C + Math.cos(a) * (R + 1), y: C + Math.sin(a) * (R + 1),
      vx: Math.cos(a) * 0.22 + (Math.random() - 0.5) * 0.1,
      vy: Math.sin(a) * 0.22 - 0.12,
      life: 1, size: 0.8 + Math.random() * 1.6, gold: Math.random() < 0.7,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, S, S);
    const pulse = 0.5 + 0.5 * Math.sin(t * (alertOn ? 6 : 2));

    // soft outer glow
    const glow = ctx.createRadialGradient(C, C, R * 0.7, C, C, R + 13);
    if (alertOn) {
      glow.addColorStop(0, 'rgba(255, 214, 90,' + (0.55 + 0.3 * pulse) + ')');
    } else {
      glow.addColorStop(0, 'rgba(40, 210, 130,' + (0.30 + 0.14 * pulse) + ')');
    }
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(C, C, R + 13, 0, 6.283); ctx.fill();

    // orb body (clipped drawing from here)
    ctx.save();
    ctx.beginPath(); ctx.arc(C, C, R, 0, 6.283); ctx.clip();
    const body = ctx.createRadialGradient(C - 7, C - 9, 2, C, C, R);
    if (alertOn) {
      body.addColorStop(0, '#fff0b0'); body.addColorStop(0.35, '#e0b73a');
      body.addColorStop(0.75, '#6b4f0b'); body.addColorStop(1, '#1d1403');
    } else {
      body.addColorStop(0, '#6df5b6'); body.addColorStop(0.32, '#1fa968');
      body.addColorStop(0.75, '#0a4a2e'); body.addColorStop(1, '#031a0f');
    }
    ctx.fillStyle = body;
    ctx.fillRect(0, 0, S, S);

    // swirling energy
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const a = t * (0.55 + i * 0.27) + i * 1.9;
      const bx = C + Math.cos(a) * R * 0.46;
      const by = C + Math.sin(a * 1.3) * R * 0.42;
      const useGold = alertOn ? i % 2 === 1 : i % 2 === 0;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, R * 0.62);
      g.addColorStop(0, useGold ? 'rgba(255, 205, 80, 0.40)' : 'rgba(70, 255, 170, 0.34)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, S, S);
    }
    ctx.globalCompositeOperation = 'source-over';

    // bubbles rising inside the orb
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.age += 1; b.y -= b.vy * (alertOn ? 1.8 : hover ? 1.4 : 1); b.x += Math.sin(b.ph + b.age * 0.09) * 0.28;
      const top = C - R * 0.92;
      const fade = Math.max(0, Math.min(1, (b.y - top) / 10)) * Math.min(1, b.age / 8);
      if (b.y < top || fade <= 0) { bubbles.splice(i, 1); continue; }
      const col = b.gold ? '255, 214, 100' : '150, 255, 205';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283);
      ctx.fillStyle = 'rgba(' + col + ',' + (0.10 * fade) + ')'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(' + col + ',' + (0.85 * fade) + ')'; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, Math.max(0.5, b.r * 0.22), 0, 6.283);
      ctx.fillStyle = 'rgba(255, 255, 255,' + (0.9 * fade) + ')'; ctx.fill();
    }
    ctx.restore();

    // gold rim
    const rim = ctx.createLinearGradient(C - R, C - R, C + R, C + R);
    rim.addColorStop(0, '#fbe9a3'); rim.addColorStop(0.5, '#d4af37'); rim.addColorStop(1, '#7a5c10');
    ctx.lineWidth = 1.7; ctx.strokeStyle = rim;
    ctx.beginPath(); ctx.arc(C, C, R, 0, 6.283); ctx.stroke();

    // sparks drifting off the edge
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.022;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 6.283);
      ctx.fillStyle = (s.gold ? 'rgba(255, 220, 110,' : 'rgba(120, 255, 190,') + (0.9 * s.life) + ')';
      ctx.fill();
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 33) return;             // about 30 frames a second keeps CPU use tiny
    last = now;
    t += 0.033 * (alertOn ? 2.2 : hover ? 1.6 : 1);
    if (Math.random() < (alertOn ? 0.38 : hover ? 0.24 : 0.12) && bubbles.length < 14) spawnBubble();
    if (Math.random() < (alertOn ? 0.35 : 0.09) && sparks.length < 12) spawnSpark();
    draw();
  }
  for (let i = 0; i < 6; i++) { spawnBubble(); bubbles[i].y -= Math.random() * R; }   // start already bubbling
  requestAnimationFrame(frame);

  // ---------- click, drag, right-click ----------
  const inOrb = (e) => Math.hypot(e.offsetX - C, e.offsetY - C) <= R + 6;
  let down = false, moved = false, sx = 0, sy = 0;

  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || !inOrb(e)) return;
    down = true; moved = false; sx = e.screenX; sy = e.screenY;
    cv.setPointerCapture(e.pointerId);
    window.jarvis.dragStart();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down) { hover = inOrb(e); return; }
    if (!moved && Math.hypot(e.screenX - sx, e.screenY - sy) > 4) moved = true;
    if (moved) window.jarvis.dragMove();
  });
  cv.addEventListener('pointerleave', () => { hover = false; });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return;
    down = false;
    cv.releasePointerCapture(e.pointerId);
    if (!moved) { alertOn = false; window.jarvis.dotClick(); }
  });
  cv.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.jarvis.dotMenu();
  });
  window.jarvis.onAlert(() => { alertOn = true; });
</script>
</body>
</html>
