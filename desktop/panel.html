<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:8000">
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #22262e; --border: #2a2e37;
    --text: #e6e8ec; --muted: #8a90a0; --accent: #7c5cff; --accent2: #6ee7ff;
    --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #app.enter { animation: slide 0.22s ease-out; }
  @keyframes slide { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  #status { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  #status.on { background: var(--ok); }
  .hbtns { display: flex; gap: 6px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }

  nav { display: flex; gap: 4px; padding: 8px 14px 0; }
  nav button { flex: 1; border-radius: 8px 8px 0 0; border-bottom: none; background: transparent; color: var(--muted); }
  nav button.active { background: var(--panel); color: var(--text); }

  .tab { display: none; flex: 1; min-height: 0; flex-direction: column; background: var(--panel); }
  .tab.active { display: flex; }
  #offline { display: none; margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px;
    background: rgba(248, 113, 113, 0.12); color: var(--bad); font-size: 13px; }

  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); }
  .msg.assistant { align-self: flex-start; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; }
  .msg.system { align-self: center; background: rgba(251, 191, 36, 0.14); color: var(--warn); font-size: 13px; }
  .msg.assistant:empty::after { content: "..."; color: var(--muted); }
  .chip { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: rgba(251, 191, 36, 0.12);
    color: var(--warn); white-space: pre-wrap; }
  .chip.mem { background: rgba(110, 231, 255, 0.10); color: var(--accent2); }
  .chip.err { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
  details.think { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--border); padding-left: 8px; }
  details.think summary { cursor: pointer; }
  details.think div { white-space: pre-wrap; margin-top: 4px; }

  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--border); }
  .composer textarea { flex: 1; resize: none; max-height: 140px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .think-toggle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; padding-bottom: 8px; }

  .list { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .adder { display: flex; gap: 6px; padding: 12px 14px 0; flex-wrap: wrap; }
  .adder input { flex: 1; min-width: 120px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font: inherit; outline: none; }
  .adder input[type=datetime-local] { flex: 0 0 auto; color-scheme: dark; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .row.done .grow { text-decoration: line-through; color: var(--muted); }
  .grow { flex: 1; }
  .due { font-size: 12px; color: var(--muted); }
  .due.overdue { color: var(--bad); }
  .section { margin: 12px 0 2px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .empty { color: var(--muted); padding: 12px 4px; }
  .meta { font-size: 12px; color: var(--muted); }

  .voicebar { display: flex; align-items: center; gap: 8px; padding: 6px 14px 0; font-size: 12px; color: var(--muted); }
  .voicebar label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .voicebar select { max-width: 150px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 4px; font: inherit; font-size: 12px; color-scheme: dark; }
  .voicebar button { padding: 1px 8px; font-size: 12px; }
  #voice-status { flex: 1; text-align: right; color: var(--accent2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mic.listening { background: var(--bad); border-color: var(--bad); animation: rec 1s ease-in-out infinite; }
  @keyframes rec { 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span id="status"></span>LOKI</div>
    <div class="hbtns">
      <button id="pin" title="Keep the panel open when you click elsewhere">Pin</button>
      <button id="quit" title="Quit LOKI">Quit</button>
      <button id="close" title="Close (Esc)">Close</button>
    </div>
  </header>
  <div id="offline">Backend offline. Start it with start-loki.bat, or run: uvicorn main:app</div>

  <nav>
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="habits">Habits</button>
  </nav>

  <section id="tab-chat" class="tab active">
    <div id="messages"></div>
    <div class="voicebar">
      <label><input type="checkbox" id="speak"> Speak replies</label>
      <select id="voice-select" title="Voice"></select>
      <button id="stop-speak" style="display:none">Stop</button>
      <span id="voice-status"></span>
    </div>
    <div class="composer">
      <label class="think-toggle"><input type="checkbox" id="think"> Think</label>
      <textarea id="input" rows="1" placeholder="Ask LOKI anything..."></textarea>
      <button id="mic" title="Talk to LOKI (Ctrl+Alt+V)">Mic</button>
      <button id="send">Send</button>
    </div>
  </section>

  <section id="tab-tasks" class="tab">
    <div class="adder">
      <input id="task-title" placeholder="New task...">
      <input id="task-due" type="datetime-local" title="Optional due date">
      <button id="task-add">Add</button>
    </div>
    <div class="list" id="task-list"></div>
  </section>

  <section id="tab-habits" class="tab">
    <div class="adder">
      <input id="habit-name" placeholder="New habit (e.g. gym)">
      <button id="habit-add">Add</button>
    </div>
    <div class="list" id="habit-list"></div>
  </section>
</div>

<script>
  const API = 'http://127.0.0.1:8000';
  const $ = (s) => document.querySelector(s);
  const post = (path, body) => fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------- Tabs ----------
  document.querySelectorAll('nav button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('active', x === b));
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
      if (b.dataset.tab === 'tasks') loadTasks();
      if (b.dataset.tab === 'habits') loadHabits();
      if (b.dataset.tab === 'chat') $('#input').focus();
    };
  });

  // ---------- Header buttons ----------
  let pinned = false;
  $('#pin').onclick = () => {
    pinned = !pinned;
    $('#pin').classList.toggle('on', pinned);
    window.jarvis.setPinned(pinned);
  };
  $('#close').onclick = () => window.jarvis.hidePanel();
  $('#quit').onclick = () => window.jarvis.quit();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.jarvis.hidePanel(); });

  window.jarvis.onPanelShown(() => {
    const app = $('#app');
    app.classList.remove('enter');
    void app.offsetWidth;
    app.classList.add('enter');
    $('#input').focus();
    loadTasks(); loadHabits();
  });

  // ---------- Backend status ----------
  async function ping() {
    try {
      const r = await fetch(API + '/');
      const ok = r.ok;
      $('#status').classList.toggle('on', ok);
      $('#offline').style.display = ok ? 'none' : 'block';
    } catch {
      $('#status').classList.remove('on');
      $('#offline').style.display = 'block';
    }
  }
  ping(); setInterval(ping, 5000);

  // ---------- Chat ----------
  const messages = $('#messages');
  let busy = false;
  const scrollDown = () => { messages.scrollTop = messages.scrollHeight; };

  function addMsg(role, text) {
    const m = el('div', 'msg ' + role, text);
    messages.append(m);
    scrollDown();
    return m;
  }

  async function sendMessage(text, viaVoice = false) {
    if (busy || !text.trim()) return;
    busy = true;
    stopSpeaking();
    const speakThis = viaVoice || $('#speak').checked;
    $('#send').disabled = true;
    addMsg('user', text);
    const bot = addMsg('assistant', '');
    let thinkEl = null, thinkBody = null, curText = null;

    function handle(e) {
      if (e.type === 'thinking') {
        if (!thinkEl) {
          thinkEl = el('details', 'think');
          thinkEl.open = true;
          thinkEl.append(el('summary', null, 'Thinking...'));
          thinkBody = el('div');
          thinkEl.append(thinkBody);
          bot.append(thinkEl);
          curText = null;
        }
        thinkBody.textContent += e.text;
      } else if (e.type === 'content') {
        if (thinkEl) {
          thinkEl.open = false;
          thinkEl.querySelector('summary').textContent = 'Thought process';
          thinkEl = null;
        }
        if (!curText) { curText = el('div'); bot.append(curText); }
        curText.textContent += e.text;
        if (speakThis) ttsFeed(e.text);
      } else if (e.type === 'tool') {
        const args = Object.entries(e.args || {}).map(([k, v]) => k + '=' + JSON.stringify(v)).join(', ');
        bot.append(el('div', 'chip', e.name + '(' + args + ')\n-> ' + e.result));
        thinkEl = null; curText = null;
      } else if (e.type === 'memory') {
        const names = e.items.map((i) => i.source + ' (' + i.score + ')').join(', ');
        bot.append(el('div', 'chip mem', 'Recalled: ' + names));
      } else if (e.type === 'error') {
        bot.append(el('div', 'chip err', e.text));
      }
      scrollDown();
    }

    try {
      const res = await post('/chat', { message: text, think: $('#think').checked });
      if (!res.ok) throw new Error(await res.text());
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (line) handle(JSON.parse(line));
        }
      }
    } catch (err) {
      bot.append(el('div', 'chip err', 'Error: ' + err.message));
    }
    if (speakThis) ttsFlush();
    busy = false;
    $('#send').disabled = false;
    $('#input').focus();
    loadTasks(); loadHabits();
  }

  const input = $('#input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const t = input.value;
      input.value = ''; input.style.height = 'auto';
      sendMessage(t);
    }
  });
  $('#send').onclick = () => {
    const t = input.value;
    input.value = ''; input.style.height = 'auto';
    sendMessage(t);
  };

  window.jarvis.onReminder((r) => addMsg('system', 'Reminder: ' + r.text));

  // ---------- Tasks ----------
  function isOverdue(t) {
    if (t.status !== 'open' || !t.due) return false;
    const d = t.due.length === 10 ? new Date(t.due + 'T23:59') : new Date(t.due.replace(' ', 'T'));
    return d < new Date();
  }

  function taskRow(t) {
    const row = el('label', 'row' + (t.status === 'done' ? ' done' : ''));
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.status === 'done';
    cb.onchange = async () => { await post('/api/tasks/' + t.id + '/toggle'); loadTasks(); };
    row.append(cb, el('span', 'grow', t.title));
    if (t.due) row.append(el('span', 'due' + (isOverdue(t) ? ' overdue' : ''), t.due));
    return row;
  }

  async function loadTasks() {
    try {
      const tasks = await (await fetch(API + '/api/tasks?status=all')).json();
      const list = $('#task-list');
      list.replaceChildren();
      const open = tasks.filter((t) => t.status === 'open');
      const done = tasks.filter((t) => t.status === 'done');
      if (!open.length) list.append(el('div', 'empty', 'No open tasks.'));
      open.forEach((t) => list.append(taskRow(t)));
      if (done.length) {
        list.append(el('div', 'section', 'Done'));
        done.slice(-10).reverse().forEach((t) => list.append(taskRow(t)));
      }
    } catch { /* backend offline */ }
  }

  async function addTask() {
    const title = $('#task-title').value.trim();
    if (!title) return;
    await post('/api/tasks', { title, due: $('#task-due').value || null });
    $('#task-title').value = ''; $('#task-due').value = '';
    loadTasks();
  }
  $('#task-add').onclick = addTask;
  $('#task-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

  // ---------- Habits ----------
  async function loadHabits() {
    try {
      const habits = await (await fetch(API + '/api/habits')).json();
      const list = $('#habit-list');
      list.replaceChildren();
      if (!habits.length) list.append(el('div', 'empty', 'No habits yet. Add one above.'));
      habits.forEach((h) => {
        const row = el('div', 'row');
        const info = el('div', 'grow');
        info.append(el('div', null, h.name));
        info.append(el('div', 'meta', 'streak ' + h.streak + ' day(s)  |  ' + h.week + '/7 this week  |  ' + h.total + ' total'));
        const btn = el('button', null, h.done_today ? 'Done' : 'Done today');
        btn.disabled = h.done_today;
        btn.onclick = async () => { await post('/api/habits/' + h.id + '/log'); loadHabits(); };
        row.append(info, btn);
        list.append(row);
      });
    } catch { /* backend offline */ }
  }

  async function addHabit() {
    const name = $('#habit-name').value.trim();
    if (!name) return;
    await post('/api/habits', { name });
    $('#habit-name').value = '';
    loadHabits();
  }
  $('#habit-add').onclick = addHabit;
  $('#habit-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') addHabit(); });

  // ---------- Voice ----------
  const SPEECH_RMS = 0.015;    // louder than this counts as speech (raise it if background noise keeps it listening)
  const SILENCE_MS = 1400;     // this much quiet after you speak = you're done
  const NO_SPEECH_MS = 7000;   // give up if nothing is said
  const MAX_RECORD_MS = 30000;

  const rec = { active: false };
  let ttsBuf = '';
  let voices = [];
  const voiceStatus = (t) => { $('#voice-status').textContent = t; };

  // --- Speaking (built-in Windows voices, offline) ---
  function pickVoice() {
    let saved = null;
    try { saved = localStorage.getItem('voiceName'); } catch { /* ignore */ }
    return voices.find((v) => v.name === saved)
      || voices.find((v) => v.lang === 'en-IN')
      || voices.find((v) => v.lang.startsWith('en'))
      || voices[0] || null;
  }

  function fillVoices() {
    voices = speechSynthesis.getVoices().filter((v) => v.localService);
    const sel = $('#voice-select');
    sel.replaceChildren();
    voices.forEach((v) => {
      const o = el('option', null, v.name.replace('Microsoft ', '') + ' (' + v.lang + ')');
      o.value = v.name;
      sel.append(o);
    });
    const v = pickVoice();
    if (v) sel.value = v.name;
  }

  function speakChunk(text) {
    const clean = text
      .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '')
      .replace(/[*_`#>~]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = 1.05;
    speechSynthesis.speak(u);
  }

  function ttsFeed(t) {
    ttsBuf += t;
    let m;
    while ((m = ttsBuf.match(/^([\s\S]*?(?:[.!?]+\s+|\n+))/))) {
      speakChunk(m[1]);
      ttsBuf = ttsBuf.slice(m[0].length);
    }
  }
  function ttsFlush() {
    if (ttsBuf.trim()) speakChunk(ttsBuf);
    ttsBuf = '';
  }
  function stopSpeaking() {
    ttsBuf = '';
    speechSynthesis.cancel();
  }

  speechSynthesis.onvoiceschanged = fillVoices;
  $('#voice-select').onchange = () => {
    try { localStorage.setItem('voiceName', $('#voice-select').value); } catch { /* ignore */ }
    stopSpeaking();
    speakChunk('Hi, I am Loki.');
  };
  try { $('#speak').checked = localStorage.getItem('speak') === '1'; } catch { /* ignore */ }
  $('#speak').onchange = () => {
    try { localStorage.setItem('speak', $('#speak').checked ? '1' : '0'); } catch { /* ignore */ }
    if (!$('#speak').checked) stopSpeaking();
  };
  $('#stop-speak').onclick = stopSpeaking;
  setInterval(() => {
    $('#stop-speak').style.display = speechSynthesis.speaking ? 'inline-block' : 'none';
  }, 400);

  // --- Listening (microphone -> offline Whisper on the backend) ---
  function setMic(on) {
    $('#mic').classList.toggle('listening', on);
    $('#mic').textContent = on ? 'Stop' : 'Mic';
  }

  function toPcm16(chunks) {
    let n = 0;
    chunks.forEach((c) => { n += c.length; });
    const out = new Int16Array(n);
    let o = 0;
    for (const c of chunks) {
      for (let i = 0; i < c.length; i++) {
        const s = Math.max(-1, Math.min(1, c[i]));
        out[o++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
    }
    return out;
  }

  async function startListening() {
    if (rec.active) return;
    if (busy) { voiceStatus('Wait for the reply to finish.'); return; }
    stopSpeaking();
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch {
      voiceStatus('Microphone blocked. Windows Settings > Privacy > Microphone.');
      return;
    }
    rec.ctx = new AudioContext({ sampleRate: 16000 });
    await rec.ctx.resume();
    rec.src = rec.ctx.createMediaStreamSource(rec.stream);
    rec.proc = rec.ctx.createScriptProcessor(4096, 1, 1);
    rec.chunks = [];
    rec.heard = false;
    rec.silentSince = 0;
    rec.startedAt = performance.now();
    rec.active = true;

    rec.proc.onaudioprocess = (ev) => {
      if (!rec.active) return;
      const data = ev.inputBuffer.getChannelData(0);
      rec.chunks.push(new Float32Array(data));
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      const now = performance.now();
      if (rms > SPEECH_RMS) {
        rec.heard = true;
        rec.silentSince = 0;
      } else if (rec.heard) {
        if (!rec.silentSince) rec.silentSince = now;
        else if (now - rec.silentSince > SILENCE_MS) finishListening(true);
      }
      if (!rec.heard && now - rec.startedAt > NO_SPEECH_MS) finishListening(false, "Didn't hear anything.");
      if (now - rec.startedAt > MAX_RECORD_MS) finishListening(true);
    };
    rec.src.connect(rec.proc);
    rec.proc.connect(rec.ctx.destination);
    setMic(true);
    voiceStatus('Listening... speak, then pause.');
  }

  function finishListening(send, note) {
    if (!rec.active) return;
    rec.active = false;
    try {
      rec.proc.disconnect();
      rec.src.disconnect();
      rec.stream.getTracks().forEach((t) => t.stop());
      rec.ctx.close();
    } catch { /* ignore */ }
    setMic(false);
    if (!send) { voiceStatus(note || ''); return; }
    const pcm = toPcm16(rec.chunks);
    rec.chunks = [];
    transcribeAndSend(pcm);
  }

  async function transcribeAndSend(pcm) {
    voiceStatus('Transcribing...');
    try {
      const res = await fetch(API + '/voice/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: pcm.buffer,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Transcription failed');
      if (data.text) {
        voiceStatus('');
        sendMessage(data.text, true);
      } else {
        voiceStatus("Didn't catch that. Try again.");
      }
    } catch (e) {
      voiceStatus('Voice error: ' + e.message);
    }
  }

  function toggleListening() { rec.active ? finishListening(true) : startListening(); }
  $('#mic').onclick = toggleListening;
  window.jarvis.onVoiceToggle(toggleListening);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { finishListening(false); stopSpeaking(); }
  });
  fillVoices();

  addMsg('system', 'Ready. Ctrl+Alt+Space opens or closes this panel. Ctrl+Alt+V starts voice.');
  loadTasks(); loadHabits();
</script>
</body>
</html>
