:root {
  --bg: #000000; --bg2: #0c0c0c; --bg3: #141414;
  --line: #232323; --line-gold: rgba(212, 175, 55, 0.30);
  --green: #1fa968; --green-l: #5af0b0; --green-d: #13663c;
  --gold: #d4af37; --gold-l: #f3dd8a; --gold-d: #8f6f17;
  --text: #f6f2e6; --muted: #8d9b92; --red: #e0524a;
  --sans: "Space Grotesk", "Segoe UI Variable", "Segoe UI", "Nirmala UI", system-ui, sans-serif;
  --display: "Space Grotesk", "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 500 14px/1.55 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app {
  position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: #000000;
  border-left: 1px solid var(--line-gold);
}
#app.enter { animation: slideIn 0.24s ease-out; }
@keyframes slideIn { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 11px;
  border-bottom: 1px solid var(--line-gold); background: #000000; }
.brand { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; padding-left: 2px; }
h1 { margin: 0; font: 700 25px/1 var(--display); letter-spacing: 0.3em; padding-left: 4px;
  background: linear-gradient(180deg, #fbebb0 0%, #d4af37 52%, #8f6f17 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
#status { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); margin-left: 2px; }
#status.on { background: var(--green-l); box-shadow: 0 0 9px var(--green); }
.hbtns { display: flex; gap: 4px; }

.ibtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px;
  background: transparent; border: 1px solid transparent; color: var(--gold); transition: 0.15s; }
.ibtn:hover { background: rgba(212, 175, 55, 0.12); border-color: var(--line-gold); color: var(--gold-l); }
.ibtn.on { background: linear-gradient(135deg, #e6c552, #a98322); color: #1a1303; border-color: transparent; }
.ibtn.on svg { fill: currentColor; }
.ibtn.danger:hover { background: rgba(224, 82, 74, 0.16); border-color: rgba(224, 82, 74, 0.5); color: #ff8f88; }
.ibtn.small { width: 28px; height: 28px; border-radius: 8px; }
.ibtn.small svg { width: 15px; height: 15px; }
.ibtn.armed { background: rgba(224, 82, 74, 0.25); border-color: var(--red); color: #ffb0aa; }

#offline { display: none; margin: 10px 14px 0; padding: 8px 12px; border-radius: 10px; font-size: 12.5px;
  background: rgba(224, 82, 74, 0.12); border: 1px solid rgba(224, 82, 74, 0.35); color: #ff9d96; }

/* ---------- messages ---------- */
#messages { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 12px; }
#messages::-webkit-scrollbar { width: 8px; }
#messages::-webkit-scrollbar-thumb { background: #1e3a2b; border-radius: 8px; }
#messages::-webkit-scrollbar-thumb:hover { background: var(--green-d); }

.msg { max-width: 88%; padding: 10px 14px; word-wrap: break-word; white-space: pre-wrap; animation: rise 0.18s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.msg.user { align-self: flex-end; color: #fff; border-radius: 18px 18px 4px 18px;
  background: linear-gradient(135deg, #1c8c56, #12623a);
  border: 1px solid rgba(90, 240, 176, 0.28);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
.msg.assistant { align-self: flex-start; color: #fff; border-radius: 18px 18px 18px 4px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), transparent 45%), linear-gradient(135deg, #a3751a, #7b540e);
  border: 1px solid rgba(243, 221, 138, 0.45);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.32); display: flex; flex-direction: column; gap: 7px; }
.msg.system { align-self: center; max-width: 94%; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; text-align: center;
  color: var(--gold-l); background: rgba(212, 175, 55, 0.09); border: 1px solid var(--line-gold); }
.msg code { font: 12.5px var(--mono); background: rgba(0, 0, 0, 0.32); padding: 1px 6px; border-radius: 6px; }
.msg strong { font-weight: 700; }

.msg.pending::after { content: ""; width: 34px; height: 8px; margin: 3px 0;
  background: radial-gradient(circle, #fff 3px, transparent 3.5px) 0 50% / 12px 8px repeat-x; animation: dots 1s ease-in-out infinite; }
@keyframes dots { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

.chip { font: 11.5px/1.45 var(--mono); padding: 6px 9px; border-radius: 9px; white-space: pre-wrap; text-shadow: none;
  background: rgba(0, 0, 0, 0.30); border: 1px solid rgba(255, 255, 255, 0.12); color: #ffe9a8; }
.chip.mem { color: #a6f5cd; }
.chip.err { color: #ffb8b2; border-color: rgba(255, 120, 110, 0.4); }
details.think { font-size: 12.5px; padding: 6px 10px; border-radius: 10px; background: rgba(0, 0, 0, 0.26); color: rgba(255, 255, 255, 0.82); text-shadow: none; }
details.think summary { cursor: pointer; font-weight: 700; color: #ffe9a8; }
details.think div { white-space: pre-wrap; margin-top: 5px; }

/* ---------- empty state ---------- */
.empty-state { margin: auto; text-align: center; padding: 0 18px 30px; max-width: 360px; animation: rise 0.3s ease-out; }
.empty-state h2 { margin: 0 0 8px; font: 700 23px/1.2 var(--display); letter-spacing: 0.01em; color: var(--gold-l); }
.empty-state p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
.suggest { display: flex; flex-direction: column; gap: 8px; }
.suggest button { padding: 9px 14px; border-radius: 12px; background: rgba(212, 175, 55, 0.06);
  border: 1px solid var(--line-gold); color: var(--text); font-size: 13px; text-align: left; transition: 0.15s; }
.suggest button:hover { background: rgba(31, 169, 104, 0.16); border-color: var(--green); }

/* ---------- dock (toolbar + composer) ---------- */
.dock { padding: 6px 12px 14px; border-top: 1px solid var(--line); background: #000000; }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 4px 2px 8px; }
.chip-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: transparent; border: 1px solid var(--line); color: var(--muted); transition: 0.15s; }
.chip-btn svg { width: 14px; height: 14px; }
.chip-btn:hover { border-color: var(--line-gold); color: var(--text); }
.chip-btn.on { background: rgba(212, 175, 55, 0.12); border-color: var(--gold); color: var(--gold-l); }
.chip-btn.stop { color: #ffb0aa; border-color: rgba(224, 82, 74, 0.5); }
#voice-select { max-width: 128px; padding: 4px 8px; border-radius: 999px; font: 600 11.5px var(--sans); color: var(--muted);
  background: var(--bg2); border: 1px solid var(--line); color-scheme: dark; outline: none; }
#voice-status { flex: 1; text-align: right; font-size: 11.5px; color: var(--green-l); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 7px 7px 7px 14px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--line); transition: 0.15s; }
.composer:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12); }
.composer textarea { flex: 1; resize: none; max-height: 140px; padding: 7px 0; background: transparent; border: none; outline: none;
  color: var(--text); font: 500 14px/1.45 var(--sans); }
.composer textarea::placeholder { color: #5f6d65; }
.round { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid transparent; flex: none; transition: 0.15s; }
.round.mic { background: var(--bg3); border-color: var(--line-gold); color: var(--gold); }
.round.mic:hover { background: rgba(212, 175, 55, 0.14); }
.round.mic.listening { background: var(--red); border-color: var(--red); color: #fff; animation: rec 1s ease-in-out infinite; }
@keyframes rec { 0%, 100% { box-shadow: 0 0 0 0 rgba(224, 82, 74, 0.55); } 50% { box-shadow: 0 0 0 9px rgba(224, 82, 74, 0); } }
.round.send { background: linear-gradient(135deg, #25b673, #12623a); color: #fff; box-shadow: 0 2px 10px rgba(31, 169, 104, 0.35); }
.round.send:hover { filter: brightness(1.12); }
.round.send:disabled { background: #17211b; color: #4b5a51; box-shadow: none; cursor: default; filter: none; }

/* ---------- sidebar drawer ---------- */
#scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
#scrim.show { opacity: 1; pointer-events: auto; }
#drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(86%, 340px); z-index: 6; display: flex; flex-direction: column;
  transform: translateX(-102%); transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
  background: #000000; border-right: 1px solid var(--line-gold); box-shadow: 8px 0 30px rgba(0, 0, 0, 0.6); }
#drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 16px; }
.drawer-title { font: 700 12px var(--display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-l); }
#new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 12px 10px; padding: 10px; border-radius: 12px;
  font-weight: 700; color: #fff; background: linear-gradient(135deg, #25b673, #12623a); border: 1px solid rgba(90, 240, 176, 0.3); transition: 0.15s; }
#new-chat:hover { filter: brightness(1.12); }
#conv-search { margin: 0 12px 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line);
  color: var(--text); font: 500 13px var(--sans); outline: none; }
#conv-search:focus { border-color: var(--gold); }
#conv-list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
#conv-list::-webkit-scrollbar { width: 6px; }
#conv-list::-webkit-scrollbar-thumb { background: #1e3a2b; border-radius: 6px; }
.group { padding: 12px 8px 4px; font: 700 10px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.conv { display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; border-left: 3px solid transparent; transition: 0.12s; }
.conv:hover { background: rgba(212, 175, 55, 0.08); }
.conv.active { background: rgba(31, 169, 104, 0.16); border-left-color: var(--gold); }
.conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.conv .ibtn { opacity: 0; }
.conv:hover .ibtn, .conv.active .ibtn, .conv .ibtn.armed { opacity: 1; }
.list-empty { padding: 18px 10px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ibtn" id="menu" title="Chats" aria-label="Chats"></button>
    <div class="brand">
      <h1>LOKI</h1>
      <span id="status" title="Backend status"></span>
    </div>
    <div class="hbtns">
      <button class="ibtn" id="pin" title="Pin open" aria-label="Pin open"></button>
      <button class="ibtn" id="min" title="Minimize (Esc)" aria-label="Minimize"></button>
      <button class="ibtn danger" id="quit" title="Quit LOKI" aria-label="Quit LOKI"></button>
    </div>
  </header>
  <div id="offline">Backend offline. Start it with start-loki.bat, or run: uvicorn main:app</div>

  <div id="messages"></div>

  <div class="dock">
    <div class="toolbar">
      <button class="chip-btn" id="think-btn" title="Show LOKI's reasoning (slower)"></button>
      <button class="chip-btn" id="speak-btn" title="Read replies aloud"></button>
      <select id="voice-select" title="Voice"></select>
      <button class="chip-btn stop" id="stop-speak" hidden></button>
      <span id="voice-status"></span>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask LOKI anything..."></textarea>
      <button class="round mic" id="mic" title="Talk to LOKI (Ctrl+Alt+V)" aria-label="Talk to LOKI"></button>
      <button class="round send" id="send" title="Send" aria-label="Send"></button>
    </div>
  </div>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="Chats">
    <div class="drawer-head">
      <span class="drawer-title">Chats</span>
      <button class="ibtn" id="drawer-close" title="Close" aria-label="Close"></button>
    </div>
    <button id="new-chat"></button>
    <input id="conv-search" placeholder="Search chats...">
    <div id="conv-list"></div>
  </aside>
</div>

<script>
  const API = 'http://127.0.0.1:8000';
  const $ = (s) => document.querySelector(s);
  const post = (path, body) => fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
  };

  // ---------- Icons (fixed, trusted markup) ----------
  const ICONS = {
    menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></svg>',
    minimize: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
    power: '<svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    send: '<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
    mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
    think: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
    speaker: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
    muted: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  };
  $('#menu').innerHTML = ICONS.menu;
  $('#pin').innerHTML = ICONS.pin;
  $('#min').innerHTML = ICONS.minimize;
  $('#quit').innerHTML = ICONS.power;
  $('#drawer-close').innerHTML = ICONS.close;
  $('#new-chat').innerHTML = ICONS.plus + '<span>New chat</span>';
  $('#mic').innerHTML = ICONS.mic;
  $('#send').innerHTML = ICONS.send;
  $('#stop-speak').innerHTML = ICONS.stop + 'Stop';

  // ---------- State ----------
  const messages = $('#messages');
  let busy = false;
  let convId = null;
  let stick = true;
  let pinned = false;
  let thinkOn = store.get('think') === '1';
  let speakOn = store.get('speak') === '1';

  const voiceStatus = (t) => { $('#voice-status').textContent = t; };
  const nearBottom = () => messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
  const scrollDown = (force) => { if (force || stick) messages.scrollTop = messages.scrollHeight; };
  messages.addEventListener('scroll', () => { stick = nearBottom(); });

  // ---------- Header buttons ----------
  $('#pin').onclick = () => {
    pinned = !pinned;
    $('#pin').classList.toggle('on', pinned);
    window.jarvis.setPinned(pinned);
  };
  $('#min').onclick = () => window.jarvis.hidePanel();
  $('#quit').onclick = () => window.jarvis.quit();

  window.jarvis.onPanelShown(() => {
    const app = $('#app');
    app.classList.remove('enter');
    void app.offsetWidth;
    app.classList.add('enter');
    $('#input').focus();
    refreshConversations();
    ping();
  });

  // ---------- Backend status ----------
  async function ping() {
    try {
      const ok = (await fetch(API + '/')).ok;
      $('#status').classList.toggle('on', ok);
      $('#offline').style.display = ok ? 'none' : 'block';
    } catch {
      $('#status').classList.remove('on');
      $('#offline').style.display = 'block';
    }
  }
  ping(); setInterval(ping, 5000);

  // ---------- Toggle chips ----------
  function paintToggles() {
    $('#think-btn').innerHTML = ICONS.think + 'Think';
    $('#think-btn').classList.toggle('on', thinkOn);
    $('#speak-btn').innerHTML = (speakOn ? ICONS.speaker : ICONS.muted) + 'Speak';
    $('#speak-btn').classList.toggle('on', speakOn);
  }
  $('#think-btn').onclick = () => { thinkOn = !thinkOn; store.set('think', thinkOn ? '1' : '0'); paintToggles(); };
  $('#speak-btn').onclick = () => {
    speakOn = !speakOn;
    store.set('speak', speakOn ? '1' : '0');
    if (!speakOn) stopSpeaking();
    paintToggles();
  };
  paintToggles();

  // ---------- Rendering messages ----------
  function renderMd(node, text) {
    node.replaceChildren();
    for (const p of text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/g)) {
      if (!p) continue;
      if (p.length > 4 && p.startsWith('**') && p.endsWith('**')) node.append(el('strong', null, p.slice(2, -2)));
      else if (p.length > 2 && p.startsWith('`') && p.endsWith('`')) node.append(el('code', null, p.slice(1, -1)));
      else node.append(document.createTextNode(p));
    }
  }

  function hideEmpty() { const e = messages.querySelector('.empty-state'); if (e) e.remove(); }

  function showEmpty() {
    const box = el('div', 'empty-state');
    box.append(el('h2', null, "Hi. Loki, from Asgard!"));
    box.append(el('p', null, 'I will help you with your glorious purpose.'));
    const list = el('div', 'suggest');
    ["What's the weather today?", "What's on my task list?", 'Latest tech news'].forEach((q) => {
      const b = el('button', null, q);
      b.onclick = () => sendMessage(q);
      list.append(b);
    });
    box.append(list);
    messages.append(box);
  }

  function addMsg(role, text, pending) {
    hideEmpty();
    const m = el('div', 'msg ' + role);
    if (role === 'assistant' && text) renderMd(m, text);
    else if (text) m.textContent = text;
    if (pending) m.classList.add('pending');
    messages.append(m);
    scrollDown(role === 'user');
    return m;
  }

  // ---------- Chat ----------
  async function sendMessage(text, viaVoice = false) {
    text = (text || '').trim();
    if (busy || !text) return;
    busy = true;
    $('#send').disabled = true;
    stopSpeaking();
    const speakThis = viaVoice || speakOn;
    addMsg('user', text);
    const bot = addMsg('assistant', '', true);
    let thinkEl = null, thinkBody = null, curText = null, curRaw = '';

    function handle(e) {
      bot.classList.remove('pending');
      if (e.type === 'thinking') {
        if (!thinkEl) {
          thinkEl = el('details', 'think');
          thinkEl.open = true;
          thinkEl.append(el('summary', null, 'Thinking...'));
          thinkBody = el('div');
          thinkEl.append(thinkBody);
          bot.append(thinkEl);
          curText = null;
        }
        thinkBody.textContent += e.text;
      } else if (e.type === 'content') {
        if (thinkEl) {
          thinkEl.open = false;
          thinkEl.querySelector('summary').textContent = 'Thought process';
          thinkEl = null;
        }
        if (!curText) { curText = el('div'); curRaw = ''; bot.append(curText); }
        curRaw += e.text;
        renderMd(curText, curRaw);
        if (speakThis) ttsFeed(e.text);
      } else if (e.type === 'tool') {
        const args = Object.entries(e.args || {}).map(([k, v]) => k + '=' + JSON.stringify(v)).join(', ');
        bot.append(el('div', 'chip', e.name + '(' + args + ')\n-> ' + e.result));
        thinkEl = null; curText = null;
      } else if (e.type === 'memory') {
        const names = e.items.map((i) => i.source + ' (' + i.score + ')').join(', ');
        bot.append(el('div', 'chip mem', 'Recalled: ' + names));
      } else if (e.type === 'error') {
        bot.append(el('div', 'chip err', e.text));
      } else if (e.type === 'done') {
        if (e.conversation_id) convId = e.conversation_id;
        refreshConversations();
      }
      scrollDown();
    }

    try {
      const res = await post('/chat', { message: text, think: thinkOn, conversation_id: convId });
      if (!res.ok) throw new Error(await res.text());
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (line) handle(JSON.parse(line));
        }
      }
    } catch (err) {
      bot.classList.remove('pending');
      bot.append(el('div', 'chip err', 'Error: ' + err.message));
    }
    bot.classList.remove('pending');
    if (speakThis) ttsFlush();
    busy = false;
    $('#send').disabled = false;
    $('#input').focus();
  }

  const input = $('#input');
  const submit = () => {
    const t = input.value;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(t);
  };
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  $('#send').onclick = submit;

  window.jarvis.onReminder((r) => addMsg('system', 'Reminder: ' + r.text));

  // ---------- Conversations sidebar ----------
  let convs = [];
  const drawerOpen = () => $('#drawer').classList.contains('open');
  function openDrawer() {
    refreshConversations();
    $('#drawer').classList.add('open');
    $('#scrim').classList.add('show');
    $('#conv-search').value = '';
  }
  function closeDrawer() {
    $('#drawer').classList.remove('open');
    $('#scrim').classList.remove('show');
  }
  $('#menu').onclick = () => (drawerOpen() ? closeDrawer() : openDrawer());
  $('#drawer-close').onclick = closeDrawer;
  $('#scrim').onclick = closeDrawer;
  $('#new-chat').onclick = () => newChat();
  $('#conv-search').addEventListener('input', renderConvList);

  function groupLabel(iso) {
    const d = new Date(iso), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
    const diff = Math.round((day(now) - day(d)) / 86400000);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 8) return 'Previous 7 days';
    return 'Older';
  }

  async function refreshConversations() {
    try {
      convs = await (await fetch(API + '/api/conversations')).json();
      renderConvList();
    } catch { /* backend offline */ }
  }

  function renderConvList() {
    const q = $('#conv-search').value.trim().toLowerCase();
    const list = $('#conv-list');
    list.replaceChildren();
    const items = convs.filter((c) => !q || c.title.toLowerCase().includes(q));
    if (!items.length) {
      list.append(el('div', 'list-empty', q ? 'No chats match.' : 'No chats yet. Say hello to LOKI.'));
      return;
    }
    let last = '';
    items.forEach((c) => {
      const g = groupLabel(c.updated);
      if (g !== last) { list.append(el('div', 'group', g)); last = g; }
      list.append(convRow(c));
    });
  }

  function convRow(c) {
    const row = el('div', 'conv' + (c.id === convId ? ' active' : ''));
    const del = el('button', 'ibtn small danger');
    del.innerHTML = ICONS.trash;
    del.title = 'Delete chat';
    let armed = false, timer = null;
    del.onclick = async (ev) => {
      ev.stopPropagation();
      if (!armed) {
        armed = true;
        del.innerHTML = ICONS.check;
        del.classList.add('armed');
        del.title = 'Click again to delete';
        timer = setTimeout(() => { armed = false; del.innerHTML = ICONS.trash; del.classList.remove('armed'); del.title = 'Delete chat'; }, 2500);
        return;
      }
      clearTimeout(timer);
      try { await fetch(API + '/api/conversations/' + c.id, { method: 'DELETE' }); } catch { /* ignore */ }
      if (c.id === convId) { convId = null; messages.replaceChildren(); showEmpty(); }
      refreshConversations();
    };
    row.onclick = () => openConversation(c.id);
    row.append(el('div', 'conv-title', c.title), del);
    return row;
  }

  async function openConversation(id) {
    if (busy) { voiceStatus('Wait for the reply to finish.'); return; }
    try {
      const res = await fetch(API + '/api/conversations/' + id);
      if (!res.ok) throw new Error('missing');
      const data = await res.json();
      stopSpeaking();
      convId = data.id;
      messages.replaceChildren();
      data.messages.forEach((m) => addMsg(m.role, m.content));
      closeDrawer();
      renderConvList();
      stick = true;
      scrollDown(true);
    } catch {
      voiceStatus('Could not load that chat.');
    }
  }

  function newChat() {
    if (busy) { voiceStatus('Wait for the reply to finish.'); return; }
    stopSpeaking();
    convId = null;
    messages.replaceChildren();
    showEmpty();
    closeDrawer();
    renderConvList();
    $('#input').focus();
  }

  // ---------- Voice ----------
  const SPEECH_RMS = 0.015;    // louder than this counts as speech (raise it if background noise keeps it listening)
  const SILENCE_MS = 1400;     // this much quiet after you speak = you're done
  const NO_SPEECH_MS = 7000;   // give up if nothing is said
  const MAX_RECORD_MS = 30000;

  const rec = { active: false };
  let ttsBuf = '';
  let voices = [];

  // --- Speaking (built-in Windows voices, offline) ---
  function pickVoice() {
    const saved = store.get('voiceName');
    return voices.find((v) => v.name === saved)
      || voices.find((v) => v.lang === 'en-IN')
      || voices.find((v) => v.lang.startsWith('en'))
      || voices[0] || null;
  }

  function fillVoices() {
    voices = speechSynthesis.getVoices().filter((v) => v.localService);
    const sel = $('#voice-select');
    sel.replaceChildren();
    voices.forEach((v) => {
      const o = el('option', null, v.name.replace('Microsoft ', '').split(' - ')[0]);
      o.value = v.name;
      sel.append(o);
    });
    sel.hidden = voices.length === 0;
    const v = pickVoice();
    if (v) sel.value = v.name;
  }

  function speakChunk(text) {
    const clean = text
      .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '')
      .replace(/[*_`#>~]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = 1.05;
    speechSynthesis.speak(u);
  }

  function ttsFeed(t) {
    ttsBuf += t;
    let m;
    while ((m = ttsBuf.match(/^([\s\S]*?(?:[.!?]+\s+|\n+))/))) {
      speakChunk(m[1]);
      ttsBuf = ttsBuf.slice(m[0].length);
    }
  }
  function ttsFlush() {
    if (ttsBuf.trim()) speakChunk(ttsBuf);
    ttsBuf = '';
  }
  function stopSpeaking() {
    ttsBuf = '';
    speechSynthesis.cancel();
  }

  speechSynthesis.onvoiceschanged = fillVoices;
  $('#voice-select').onchange = () => {
    store.set('voiceName', $('#voice-select').value);
    stopSpeaking();
    speakChunk('Hi, I am Loki.');
  };
  $('#stop-speak').onclick = stopSpeaking;
  setInterval(() => { $('#stop-speak').hidden = !speechSynthesis.speaking; }, 400);

  // --- Listening (microphone -> offline Whisper on the backend) ---
  function setMic(on) {
    $('#mic').classList.toggle('listening', on);
    $('#mic').innerHTML = on ? ICONS.stop : ICONS.mic;
  }

  function toPcm16(chunks) {
    let n = 0;
    chunks.forEach((c) => { n += c.length; });
    const out = new Int16Array(n);
    let o = 0;
    for (const c of chunks) {
      for (let i = 0; i < c.length; i++) {
        const s = Math.max(-1, Math.min(1, c[i]));
        out[o++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
    }
    return out;
  }

  async function startListening() {
    if (rec.active) return;
    if (busy) { voiceStatus('Wait for the reply to finish.'); return; }
    stopSpeaking();
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch {
      voiceStatus('Microphone blocked. Windows Settings > Privacy > Microphone.');
      return;
    }
    rec.ctx = new AudioContext({ sampleRate: 16000 });
    await rec.ctx.resume();
    rec.src = rec.ctx.createMediaStreamSource(rec.stream);
    rec.proc = rec.ctx.createScriptProcessor(4096, 1, 1);
    rec.chunks = [];
    rec.heard = false;
    rec.silentSince = 0;
    rec.startedAt = performance.now();
    rec.active = true;

    rec.proc.onaudioprocess = (ev) => {
      if (!rec.active) return;
      const data = ev.inputBuffer.getChannelData(0);
      rec.chunks.push(new Float32Array(data));
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      const now = performance.now();
      if (rms > SPEECH_RMS) {
        rec.heard = true;
        rec.silentSince = 0;
      } else if (rec.heard) {
        if (!rec.silentSince) rec.silentSince = now;
        else if (now - rec.silentSince > SILENCE_MS) finishListening(true);
      }
      if (!rec.heard && now - rec.startedAt > NO_SPEECH_MS) finishListening(false, "Didn't hear anything.");
      if (now - rec.startedAt > MAX_RECORD_MS) finishListening(true);
    };
    rec.src.connect(rec.proc);
    rec.proc.connect(rec.ctx.destination);
    setMic(true);
    voiceStatus('Listening... speak, then pause.');
  }

  function finishListening(send, note) {
    if (!rec.active) return;
    rec.active = false;
    try {
      rec.proc.disconnect();
      rec.src.disconnect();
      rec.stream.getTracks().forEach((t) => t.stop());
      rec.ctx.close();
    } catch { /* ignore */ }
    setMic(false);
    if (!send) { voiceStatus(note || ''); return; }
    const pcm = toPcm16(rec.chunks);
    rec.chunks = [];
    transcribeAndSend(pcm);
  }

  async function transcribeAndSend(pcm) {
    voiceStatus('Transcribing...');
    try {
      const res = await fetch(API + '/voice/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: pcm.buffer,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Transcription failed');
      if (data.text) {
        voiceStatus('');
        sendMessage(data.text, true);
      } else {
        voiceStatus("Didn't catch that. Try again.");
      }
    } catch (e) {
      voiceStatus('Voice error: ' + e.message);
    }
  }

  function toggleListening() { rec.active ? finishListening(true) : startListening(); }
  $('#mic').onclick = toggleListening;
  window.jarvis.onVoiceToggle(toggleListening);

  // ---------- Keyboard: Esc peels back one layer at a time ----------
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (drawerOpen()) { closeDrawer(); return; }
    if (rec.active) { finishListening(false); return; }
    if (speechSynthesis.speaking) { stopSpeaking(); return; }
    window.jarvis.hidePanel();
  });

  // ---------- Start ----------
  fillVoices();
  showEmpty();
  refreshConversations();
</script>
